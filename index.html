<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Download Assinatura</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; margin: 0; }
        #capture-area { background: white; padding: 0; display: inline-block; }
    </style>
</head>
<body>
    <div id="msg">Iniciando download...</div>
    <div id="capture-area"></div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            let content = params.get('content');

            if (content) {
                // Tenta decodificar de Base64 se necessário
                try {
                    if (!content.includes('<')) { content = atob(content); }
                } catch(e) { console.log("Lendo como HTML comum"); }

                const container = document.getElementById('capture-area');
                container.innerHTML = decodeURIComponent(content);

                setTimeout(() => {
                    html2canvas(container, { scale: 2, useCORS: true }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = 'assinatura_sipal.png';
                        link.href = canvas.toDataURL("image/png");
                        link.click();
                        document.getElementById('msg').innerText = "Download Concluído!";
                    });
                }, 1000);
            }
        };
    </script>
</body>
</html>
