<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; margin: 0; }
        #capture { background: white; display: inline-block; }
        .msg { margin-bottom: 20px; color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <div id="status" class="msg">Gerando sua assinatura...</div>
    <div id="capture"></div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const htmlContent = urlParams.get('content');

            if (htmlContent) {
                const area = document.getElementById('capture');
                area.innerHTML = decodeURIComponent(htmlContent);

                // Pequena pausa para garantir que o navegador renderizou o texto
                setTimeout(() => {
                    html2canvas(area, { scale: 2, useCORS: true }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = 'assinatura_sipal.png';
                        link.href = canvas.toDataURL("image/png");
                        link.click();
                        document.getElementById('status').innerText = "Download concluído!";
                    });
                }, 1000);
            } else {
                document.getElementById('status').innerText = "Aguardando dados...";
            }
        };
    </script>
</body>
</html>
